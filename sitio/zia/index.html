<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0c1517">
<title>Grupo Zamna · ZÍA con Hermes (demo)</title>
<meta property="og:title" content="Grupo Zamna · ZÍA con Hermes">
<meta property="og:description" content="Demo: grupozamna.com con ZÍA conectada a un agente especializado.">
<meta property="og:image" content="https://zamna.softvibes.art/img/prana-pool.jpg">
<link rel="icon" href="../img/grupo-zamna-positive.png">
<style>
  :root{
    --zia-bg:#0c1517; --zia-panel:#0f1d1f; --zia-ink:#f6f0e6; --zia-muted:#a9b6b0;
    --zia-gold:#d7b46f; --zia-gold-line:rgba(217,188,115,.55); --zia-green:#0f3d36;
    --zia-user:#d9c28d; --zia-sb:0px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#071d1a;overflow:hidden}
  #site{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:#071d1a}

  /* ── Lanzador: réplica exacta del de grupozamna.com para taparlo ── */
  .zia-dock{position:fixed;z-index:30;right:calc(max(12px,env(safe-area-inset-right)) + var(--zia-sb));bottom:max(12px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:flex-end;gap:10px;font-family:Montserrat,system-ui,sans-serif}
  .zia-launcher{border:1px solid var(--zia-gold-line);border-radius:99px;display:flex;align-items:center;gap:9px;justify-content:center;min-width:74px;min-height:56px;padding:7px 14px 7px 8px;background:var(--zia-bg);color:var(--zia-ink);box-shadow:0 12px 32px rgba(0,0,0,.24),0 0 0 3px var(--zia-bg);cursor:pointer;font:700 14px/1 system-ui,sans-serif;letter-spacing:.015em;transition:transform .2s}
  .zia-launcher:hover{transform:translateY(-2px)}
  .zia-launcher:focus-visible{outline:3px solid var(--zia-gold);outline-offset:3px}
  .zia-av{display:grid;place-items:center;flex-shrink:0;overflow:hidden;border-radius:50%;background:#192529;border:2px solid var(--zia-gold);box-shadow:0 0 0 2px rgba(215,180,111,.16);width:44px;height:44px}
  .zia-av img{display:block;width:100%;height:100%;object-fit:cover;border-radius:50%}
  .zia-launcher .dot{position:absolute;top:6px;left:40px;width:10px;height:10px;border-radius:50%;background:#2ecc71;border:2px solid var(--zia-bg)}
  .zia-launcher{position:relative}
  @media (max-width:430px){
    .zia-dock{right:calc(max(8px,env(safe-area-inset-right)) + var(--zia-sb));bottom:max(8px,env(safe-area-inset-bottom))}
    .zia-launcher{width:54px;min-width:54px;height:54px;min-height:54px;padding:4px}
    .zia-launcher>span.lbl{display:none}
    .zia-av{width:42px;height:42px}
    .zia-launcher .dot{left:36px;top:2px}
  }

  /* ── Panel de chat ── */
  .zia-panel{position:fixed;z-index:40;right:calc(16px + var(--zia-sb));bottom:84px;width:min(390px,calc(100vw - 32px));height:min(620px,calc(100vh - 110px));background:var(--zia-panel);color:var(--zia-ink);border:1px solid var(--zia-gold-line);border-radius:22px;box-shadow:0 30px 80px -20px rgba(0,0,0,.6);display:flex;flex-direction:column;overflow:hidden;font-family:Montserrat,system-ui,sans-serif;opacity:0;transform:translateY(16px) scale(.98);pointer-events:none;transition:opacity .22s,transform .22s}
  .zia-panel.open{opacity:1;transform:none;pointer-events:auto}
  .zia-head{display:flex;align-items:center;gap:12px;padding:14px 14px 12px 16px;background:linear-gradient(135deg,#123a33,var(--zia-bg));border-bottom:1px solid rgba(255,255,255,.08)}
  .zia-head .zia-av{width:42px;height:42px}
  .zia-head b{display:block;font-size:15px}
  .zia-head small{display:flex;align-items:center;gap:6px;color:var(--zia-muted);font-size:11.5px}
  .zia-head small i{width:7px;height:7px;border-radius:50%;background:#2ecc71;display:inline-block}
  .zia-head .sp{flex:1}
  .zia-icon{background:none;border:0;color:var(--zia-muted);cursor:pointer;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:18px}
  .zia-icon:hover{background:rgba(255,255,255,.08);color:var(--zia-ink)}
  .zia-msgs{flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
  .zia-msg{max-width:86%;padding:10px 13px;border-radius:16px;font-size:14px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word}
  .zia-msg.bot{background:rgba(255,255,255,.07);border-top-left-radius:6px;align-self:flex-start}
  .zia-msg.me{background:var(--zia-user);color:#0c1517;border-top-right-radius:6px;align-self:flex-end;font-weight:500}
  .zia-msg.err{background:rgba(200,71,61,.15);border:1px solid rgba(200,71,61,.4)}
  .zia-msg a{color:var(--zia-gold)}
  .zia-msg.me a{color:#0c1517}
  .zia-typing{display:inline-flex;gap:4px;align-items:center}
  .zia-typing i{width:7px;height:7px;border-radius:50%;background:var(--zia-muted);animation:ziab 1.2s infinite}
  .zia-typing i:nth-child(2){animation-delay:.15s}.zia-typing i:nth-child(3){animation-delay:.3s}
  @keyframes ziab{0%,60%,100%{opacity:.3;transform:none}30%{opacity:1;transform:translateY(-3px)}}
  .zia-chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 10px}
  .zia-chips button{background:transparent;border:1px solid var(--zia-gold-line);color:var(--zia-ink);border-radius:999px;padding:7px 12px;font:500 12.5px Montserrat,system-ui,sans-serif;cursor:pointer}
  .zia-chips button:hover{background:rgba(217,188,115,.12)}
  .zia-form{display:flex;gap:8px;padding:10px 12px 12px;border-top:1px solid rgba(255,255,255,.08);background:var(--zia-bg)}
  .zia-form textarea{flex:1;resize:none;max-height:110px;min-height:44px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);color:var(--zia-ink);border-radius:14px;padding:12px 13px;font:14px/1.4 Montserrat,system-ui,sans-serif}
  .zia-form textarea:focus{outline:2px solid var(--zia-gold);outline-offset:0;border-color:transparent}
  .zia-send{width:44px;height:44px;border-radius:50%;border:0;background:var(--zia-gold);color:#0c1517;cursor:pointer;font-size:18px;display:grid;place-items:center;align-self:flex-end}
  .zia-send:disabled{opacity:.45;cursor:default}
  .zia-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:0 14px 10px;background:var(--zia-bg);font-size:10.5px;color:#6f817a}
  .zia-wa{color:#25d366;text-decoration:none;font-weight:700;font-size:11.5px}
  @media (max-width:520px){
    .zia-panel{inset:0;width:100%;height:100%;border-radius:0;border:0}
  }
  @media (prefers-reduced-motion:reduce){.zia-panel,.zia-launcher{transition:none}.zia-typing i{animation:none}}
</style>
</head>
<body>
<!-- Sitio real de Grupo Zamna (no envía X-Frame-Options ni CSP frame-ancestors) -->
<iframe id="site" src="https://grupozamna.com/" title="Grupo Zamna · Bienes raíces en Riviera Maya" referrerpolicy="strict-origin-when-cross-origin"></iframe>

<div class="zia-dock">
  <button class="zia-launcher" id="zia-open" type="button" aria-label="Abrir chat con ZÍA" aria-controls="zia-panel" aria-expanded="false">
    <span class="zia-av" aria-hidden="true"><img src="../img/zia-avatar.webp" alt="" width="40" height="40"></span>
    <span class="lbl">ZÍA</span>
    <span class="dot" aria-hidden="true"></span>
  </button>
</div>

<section class="zia-panel" id="zia-panel" role="dialog" aria-modal="false" aria-labelledby="zia-title" aria-hidden="true">
  <header class="zia-head">
    <span class="zia-av" aria-hidden="true"><img src="../img/zia-avatar.webp" alt=""></span>
    <div><b id="zia-title">ZÍA</b><small><i></i><span data-t="status">Grupo Zamna · en línea</span></small></div>
    <span class="sp"></span>
    <button class="zia-icon" id="zia-reset" type="button" aria-label="Nueva conversación" title="Nueva conversación">↺</button>
    <button class="zia-icon" id="zia-close" type="button" aria-label="Cerrar chat">✕</button>
  </header>
  <div class="zia-msgs" id="zia-msgs" aria-live="polite"></div>
  <div class="zia-chips" id="zia-chips"></div>
  <form class="zia-form" id="zia-form">
    <label for="zia-input" style="position:absolute;left:-9999px">Mensaje</label>
    <textarea id="zia-input" rows="1" maxlength="800" placeholder="Escribe tu mensaje…"></textarea>
    <button class="zia-send" id="zia-send" type="submit" aria-label="Enviar">➤</button>
  </form>
  <div class="zia-foot">
    <span data-t="foot">ZÍA puede equivocarse: un asesor confirma precio y disponibilidad.</span>
    <a class="zia-wa" id="zia-wa" href="#" target="_blank" rel="noopener">WhatsApp</a>
  </div>
</section>

<script>
(() => {
  // ── Configuración ────────────────────────────────────────────────
  // Puente privado hacia el perfil de Hermes (mismo origen, vía nginx).
  const ZIA_API = window.ZIA_API || '/api/zia/chat';
  const WA_PHONE = '529841362816';
  const MAX_HISTORY = 12;           // turnos que se envían al agente
  const STORE = 'zia-zamna-v1';     // sessionStorage: la conversación muere al cerrar la pestaña

  const EN = /^en\b/i.test(navigator.language);
  const T = EN ? {
    status: 'Grupo Zamna · online', foot: 'ZÍA can make mistakes: an advisor confirms price and availability.',
    hello: "Hi, I'm ZÍA, Grupo Zamna's assistant. Are you looking to buy, rent, invest or sell in the Riviera Maya?",
    chips: ['I want to buy', 'I want to rent', 'Prana Towers', 'Sell my property'],
    ph: 'Type your message…', err: "I couldn't reach the server. You can keep talking with an advisor on WhatsApp.",
    busy: 'Too many messages in a row. Wait a moment and try again.', wa: 'Hi Grupo Zamna, I was chatting with ZÍA on your website. '
  } : {
    status: 'Grupo Zamna · en línea', foot: 'ZÍA puede equivocarse: un asesor confirma precio y disponibilidad.',
    hello: 'Hola, soy ZÍA, asistente de Grupo Zamna. ¿Buscas comprar, rentar, invertir o vender en la Riviera Maya?',
    chips: ['Quiero comprar', 'Busco rentar', 'Prana Towers', 'Vender mi propiedad'],
    ph: 'Escribe tu mensaje…', err: 'No pude conectar con el servidor. Puedes seguir con un asesor por WhatsApp.',
    busy: 'Muchos mensajes seguidos. Espera un momento y vuelve a intentar.', wa: 'Hola Grupo Zamna, estaba platicando con ZÍA en su sitio. '
  };
  if (EN) document.documentElement.lang = 'en';

  // Compensa la barra de scroll del iframe (Windows) para tapar el botón original.
  const probe = Object.assign(document.createElement('div'), { style: 'position:absolute;top:-999px;width:100px;height:100px;overflow:scroll' });
  document.body.appendChild(probe);
  document.documentElement.style.setProperty('--zia-sb', (probe.offsetWidth - probe.clientWidth) + 'px');
  probe.remove();

  const $ = (id) => document.getElementById(id);
  const panel = $('zia-panel'), openBtn = $('zia-open'), msgs = $('zia-msgs'), chips = $('zia-chips');
  const form = $('zia-form'), input = $('zia-input'), send = $('zia-send'), wa = $('zia-wa');
  document.querySelectorAll('[data-t]').forEach(n => n.textContent = T[n.dataset.t]);
  input.placeholder = T.ph;

  const sid = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random()).slice(0, 36);
  let state = load() || { sid, history: [] };
  let busy = false;

  function load() { try { return JSON.parse(sessionStorage.getItem(STORE)); } catch { return null; } }
  function save() { try { sessionStorage.setItem(STORE, JSON.stringify(state)); } catch {} }

  // Texto seguro: escapa HTML y solo convierte **negritas**, enlaces https y wa.me.
  function render(text) {
    const esc = text.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    return esc
      .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
      .replace(/\bhttps:\/\/[^\s<)]+/g, u => `<a href="${u}" target="_blank" rel="noopener">${u.replace(/^https:\/\//, '')}</a>`);
  }
  function bubble(role, text, cls = '') {
    const d = document.createElement('div');
    d.className = `zia-msg ${role === 'user' ? 'me' : 'bot'} ${cls}`;
    d.innerHTML = render(text);
    msgs.appendChild(d); msgs.scrollTop = msgs.scrollHeight;
    return d;
  }
  function typing() {
    const d = bubble('assistant', '');
    d.innerHTML = '<span class="zia-typing" aria-label="ZÍA está escribiendo"><i></i><i></i><i></i></span>';
    return d;
  }
  function paint() {
    msgs.innerHTML = '';
    bubble('assistant', T.hello);
    state.history.forEach(m => bubble(m.role, m.content));
    chips.innerHTML = '';
    if (!state.history.length) T.chips.forEach(c => {
      const b = document.createElement('button'); b.type = 'button'; b.textContent = c;
      b.onclick = () => ask(c); chips.appendChild(b);
    });
    updateWa();
  }
  function updateWa() {
    const last = [...state.history].reverse().find(m => m.role === 'user');
    const txt = T.wa + (last ? (EN ? 'My question: ' : 'Mi consulta: ') + last.content.slice(0, 300) : '');
    wa.href = `https://wa.me/${WA_PHONE}?text=${encodeURIComponent(txt)}`;
  }

  async function ask(text) {
    text = text.trim();
    if (!text || busy) return;
    busy = true; send.disabled = true; chips.innerHTML = '';
    bubble('user', text);
    const history = state.history.slice(-MAX_HISTORY);
    state.history.push({ role: 'user', content: text }); save(); updateWa();
    const t = typing();
    try {
      const r = await fetch(ZIA_API, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin',
        body: JSON.stringify({ sid: state.sid, message: text, history, lang: EN ? 'en' : 'es' })
      });
      const data = await r.json().catch(() => ({}));
      t.remove();
      if (!r.ok || !data.text) {
        bubble('assistant', r.status === 429 ? T.busy : (data.error || T.err), 'err');
        state.history.pop(); save();
      } else {
        bubble('assistant', data.text);
        state.history.push({ role: 'assistant', content: data.text }); save();
      }
    } catch {
      t.remove(); bubble('assistant', T.err, 'err'); state.history.pop(); save();
    } finally {
      busy = false; send.disabled = false; input.focus();
    }
  }

  function setOpen(o) {
    panel.classList.toggle('open', o);
    panel.setAttribute('aria-hidden', String(!o));
    openBtn.setAttribute('aria-expanded', String(o));
    if (o) { paint(); setTimeout(() => input.focus(), 50); } else openBtn.focus();
  }
  openBtn.onclick = () => setOpen(!panel.classList.contains('open'));
  $('zia-close').onclick = () => setOpen(false);
  $('zia-reset').onclick = () => { state = { sid: state.sid, history: [] }; save(); paint(); };
  addEventListener('keydown', e => { if (e.key === 'Escape' && panel.classList.contains('open')) setOpen(false); });
  form.onsubmit = (e) => { e.preventDefault(); const v = input.value; input.value = ''; input.style.height = ''; ask(v); };
  input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); } });
  input.addEventListener('input', () => { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 110) + 'px'; });
  if (new URLSearchParams(location.search).has('abrir')) setOpen(true);
})();
</script>
</body>
</html>
