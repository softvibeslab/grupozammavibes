# /etc/nginx/sites-available/zamna.softvibes.art — demo Softvibes de Grupo Zamna (estático)
server {
    listen 80;
    server_name zamna.softvibes.art;
    root /var/www/zamna;
    index index.html;

    # Demo: no indexar hasta que el cliente apruebe y tenga dominio propio
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    location ~* \.(jpg|jpeg|png|webp|css)$ {
        add_header Cache-Control "public, max-age=604800";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    location = /robots.txt {
        return 200 "User-agent: *\nDisallow: /\n";
    }
}
